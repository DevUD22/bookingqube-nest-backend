              properties:
                date: { type: string, example: '2026-08-12' }
                end_date: { type: string }
                category_id: { type: string, format: uuid }
                menu_item_id: { type: string, format: uuid }
      responses:
        '200':
          description: Totals + bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /pos/cafe/daily-closings:
    get:
      tags: [07 Cafe POS Daily Closings]
